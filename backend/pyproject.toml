[project]
name = "melora-backend"
version = "0.1.0"
description = "A modular FastAPI backend for searching, streaming, and downloading music from YouTube."
readme = "README.md"
requires-python = ">=3.12"
authors = [{ name = "Sachin Acharya" }]
dependencies = [
    "fastapi==0.136.3",
    "uvicorn[standard]==0.49.0",
    "yt-dlp==2026.3.3",
    "pydantic[email]==2.12.5",
    "pydantic-settings==2.13.1",
    "sqlalchemy==2.0.48",
    "python-dotenv==1.2.2",
    "sqladmin==0.27.2",
    "wtforms==3.1.2",
    "python-multipart==0.0.32",
    "fastapi-pagination==0.15.14",
    # Auth & Security
    "python-jose[cryptography]==3.4.0",
    "passlib[bcrypt]==1.7.4",
    "authlib==1.6.0",
    "httpx==0.28.1",
    "ytmusicapi==1.12.0",
    # Database migrations
    "alembic==1.15.2",
    # Caching
    "redis[hiredis]==6.2.0",
]

[project.optional-dependencies]
dev = [
    "ruff==0.15.6",
    "pytest==9.0.3",
    "httpx==0.28.1",
    "mypy==2.1.0",
    "bandit==1.9.4",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.ruff]
line-length = 88
target-version = "py312"
indent-width = 4

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "F",    # pyflakes
    "W",    # pycodestyle warnings
    "I",    # isort
    "N",    # pep8-naming
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "A",    # flake8-builtins
    "C4",   # flake8-comprehensions
    "T20",  # flake8-print
    "ARG",  # flake8-unused-arguments
    "PT",   # flake8-pytest-style
    "RET",  # flake8-return
    "SIM",  # flake8-simplify
    "RUF",  # Ruff-specific rules
    "FAST", # FastAPI-specific rules
    "S",    # Bandit (Security) rules
    "Q",    # flake8-quotes
    "ANN",  # flake8-annotations
    "TC",   # flake8-type-checking
    "PTH",  # flake8-use-pathlib
    "SLF",  # flake8-self
    "TID",  # flake8-tidy-imports
    "ERA",  # eradicate (commented out code)
    "TRY",  # tryceratops
    "B028", # No explicit stacklevel keyword argument in warnings.warn()
    "PL",   # Pylint
]
ignore = [
    "E501",    # line too long (handled by formatter)
    "B008",    # do not perform function calls in argument defaults (common in FastAPI deps)
    "PLR0913", # Too many arguments in function definition
    "ANN002",  # Args (*{name}) doesn't need typing
    "ANN003",  # Kwargs (**{name}) doesn't need typing
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"] # Unused imports in __init__.py are common for exports
"tests/**" = ["S101", "ANN", "PLR2004", "PT011", "B017", "ARG002", "S105", "ARG005", "ARG001", "SLF001"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"
docstring-code-format = true

[tool.mypy]
python_version = "3.12"
plugins = ["pydantic.mypy"]
strict = true
disallow_untyped_decorators = false
disallow_any_generics = true
disallow_any_explicit = false
ignore_missing_imports = true
explicit_package_bases = true
warn_unused_configs = true
exclude = ["venv", ".venv", "build", "dist"]

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

[[tool.mypy.overrides]]
module = "app.core.config"
disallow_any_explicit = false
warn_unused_ignores = false

[tool.bandit]
exclude_dirs = ["tests", "venv", ".venv"]
skips = ["B101"]                          # B101: use of assert is common in FastAPI/Pytest

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
