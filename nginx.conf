server {
    listen 80 default_server;
    listen [::]:80 default_server;

    root /usr/share/nginx/html;
    index index.html index.htm;

    server_name _;

    # API Proxy to local FastAPI backend
    location /api/v1 {
        proxy_pass http://localhost:8000/api/v1;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }

    # Catch-all API proxy so that NO /api* path (e.g. /api/, /api/v1/foo) ever
    # falls through to the SPA fallback below. Longer prefix matches still win,
    # so /api/v1/* keeps hitting the more specific block above.
    location /api {
        proxy_pass http://localhost:8000/api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Serve media (avatars, etc.) from the local FastAPI backend
    location /media {
        proxy_pass http://localhost:8000/media;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_cache_valid 200 1d;
        add_header Cache-Control "public, max-age=86400";
    }

    # FastAPI Docs
    location /docs {
        proxy_pass http://localhost:8000/docs;
    }
    location /openapi.json {
        proxy_pass http://localhost:8000/openapi.json;
    }

    # Backend Admin Site
    location /admin {
        proxy_pass http://localhost:8000/admin;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # SPA fallback - only reached for non-API browser navigation routes
    location / {
        try_files $uri $uri/ /index.html;
    }

    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
        internal;
    }

    error_log /var/log/nginx/melora_error.log;
    access_log /var/log/nginx/melora_access.log;
}
