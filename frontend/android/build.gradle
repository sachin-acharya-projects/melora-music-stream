// Top-level build file where you can add configuration options common to all sub-projects/modules.

buildscript {
    
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.7.2'
        classpath 'com.google.gms:google-services:4.4.2'

        // NOTE: Do not place your application dependencies here; they belong
        // in the individual module build.gradle files
    }
}

apply from: "variables.gradle"

allprojects {
    repositories {
        google()
        mavenCentral()
    }

    // Capacitor 7.6 sets Java 21 source/target compatibility, but the library
    // (and app) build fine on the common JDK 17. The override is applied at the
    // JavaCompile *task* level (not just the android extension) so it also wins
    // for the :capacitor-android library module, which configures its own
    // compileOptions. After evaluation so it runs after each subproject's own
    // build.gradle. No `options.release` is set, avoiding a release/sourceCompat
    // conflict.
    afterEvaluate { p ->
        p.tasks.withType(JavaCompile) { t ->
            t.sourceCompatibility = '17'
            t.targetCompatibility = '17'
        }
        def androidExt = p.extensions.findByName('android')
        if (androidExt != null) {
            androidExt.compileOptions {
                sourceCompatibility = JavaVersion.VERSION_17
                targetCompatibility = JavaVersion.VERSION_17
            }
        }
    }
}

task clean(type: Delete) {
    delete rootProject.buildDir
}
