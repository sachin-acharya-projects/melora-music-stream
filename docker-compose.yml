services:
  melora-fullstack:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: melora-app
    image: ${REGISTRY_NAMESPACE:-melora-app:latest}
    ports:
      - "${PORT:-80}:80"
    environment:
      - DEBUG=${DEBUG:-false}
    volumes:
      - melora_data:/app/data
    restart: always

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: melora-backend
    image: melora-backend:latest
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    environment:
      - DEBUG=${DEBUG:-false}
    volumes:
      - melora_data:/app/data
    restart: always

  # Note: This frontend container expects a 'backend' service to be reachable at 'backend:8000'
  # unless you modify frontend/nginx.conf.
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: melora-frontend
    image: melora-frontend:latest
    ports:
      - "${FRONTEND_PORT:-8080}:80"
    depends_on:
      - backend
    restart: always

volumes:
  melora_data:
    driver: local
