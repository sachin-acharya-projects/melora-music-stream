# =====================================================================
# Shared managed configuration.
# These values are interpolated from the root .env (and any matching
# environment variables) by `docker compose`, then injected into each
# service's container environment via the `environment` block.
# Referenced by services through the YAML anchor (&backend-env).
# =====================================================================
x-backend-env: &backend-env
  # App
  DEBUG: ${DEBUG:-false}
  JWT_SECRET_KEY: ${JWT_SECRET_KEY:-change-me-in-production-use-a-random-secret}
  FRONTEND_URL: ${FRONTEND_URL:-http://localhost:5173}
  BACKEND_CORS_ORIGINS: '${BACKEND_CORS_ORIGINS:-["*"]}'
  # Database (shared homelab Postgres, reached via networks.db_net).
  # The homelab "postgres" service exposes no host port; it is reachable
  # by name on the external db_net network. The app auto-runs
  # `alembic upgrade head` on startup, so an empty DB self-migrates.
  POSTGRES_HOST: ${POSTGRES_HOST:-postgres}
  POSTGRES_PORT: 5432
  POSTGRES_USER: ${POSTGRES_USER:-melora}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-melora}
  POSTGRES_DB: ${POSTGRES_DB:-melora}
  DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-melora}:${POSTGRES_PASSWORD:-melora}@${POSTGRES_HOST:-postgres}:5432/${POSTGRES_DB:-melora}
  # Redis
  REDIS_URL: redis://redis:6379/0
  # Storage (mounted from the melora_data volume)
  DOWNLOADS_DIR: /app/data/downloads
  CACHE_DIR: /app/data/cache
  MEDIA_DIR: /app/data/media
  LOGS_DIR: /app/data/logs
  # Google OAuth (required for login)
  GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
  GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
  GOOGLE_REDIRECT_URI: ${GOOGLE_REDIRECT_URI:-http://localhost:8000/api/v1/auth/google/callback}

services:
  # Redis for caching
  redis:
    container_name: melora-redis
    image: redis:7-alpine
    volumes:
      - melora_redis:/data
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    restart: always

  # Unified Fullstack Container (Frontend + Backend + Nginx)
  melora-fullstack:
    container_name: melora-fullstack
    image: ${REGISTRY_NAMESPACE:-melora-fullstack:latest}
    build:
      context: .
      dockerfile: Dockerfile
    environment: *backend-env
    depends_on:
      redis:
        condition: service_started
    volumes:
      - melora_data:/app/data
    # ----------------------------------------------------------------------
    # Homelab coupling (CURRENT DEPLOY TARGET ONLY)
    #
    #   db_net:    the shared homelab Postgres (server-configs "postgres"
    #              service); the app auto-runs `alembic upgrade head`.
    #   proxy_net: the homelab caddy (caddy-docker-proxy) reverse-proxies
    #              ${MELORA_DOMAIN} to this container via the labels below.
    #
    # Other deploy targets without this reverse proxy / shared Postgres
    # should drop these networks and labels and run their own DB instead.
    # ----------------------------------------------------------------------
    networks:
      - default
      - db_net
      - proxy_net
    labels:
      caddy: ${MELORA_DOMAIN}
      caddy.reverse_proxy: "{{upstreams 80}}"
    restart: always

networks:
  default:
    name: melora-music-stream_default
  db_net:
    name: db_net
    external: true
  proxy_net:
    name: proxy_net
    external: true

volumes:
  melora_data:
    driver: local
  melora_redis:
    driver: local
