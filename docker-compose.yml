services:
  # Redis for caching
  redis:
    container_name: melora-redis
    image: redis:7-alpine
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - melora_redis:/data
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    restart: always

  # Option 1: Unified Fullstack Container (Single Image)
  melora-fullstack:
    container_name: melora-fullstack
    image: ${REGISTRY_NAMESPACE:-melora-app:latest}
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "${PORT:-80}:80"
    environment:
      - DEBUG=${DEBUG:-false}
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      - redis
    volumes:
      - melora_data:/app/data
    restart: always

  # Option 2: Separate Backend Only
  backend:
    container_name: melora-backend
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: melora-backend:latest
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    environment:
      - DEBUG=${DEBUG:-false}
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      - redis
    volumes:
      - melora_data:/app/data
    restart: always

  # Option 3: Separate Frontend
  # Note: This frontend container expects a 'backend' service to be reachable at 'backend:8000'
  # unless you modify frontend/nginx.conf.
  frontend:
    container_name: melora-frontend
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: melora-frontend:latest
    ports:
      - "${FRONTEND_PORT:-8080}:80"
    depends_on:
      - backend
    restart: always

volumes:
  melora_data:
    driver: local
  melora_redis:
    driver: local
