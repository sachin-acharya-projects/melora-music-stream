# =====================================================================
# LOCAL DEVELOPMENT / QUICK-START stack.
# =====================================================================
# This is the default compose file used by `make docker-run-fullstack` and
# bare `docker compose up`. It runs its own Postgres + Redis and publishes
# host ports so the app is reachable at http://localhost:${PORT:-80},
# Postgres at POSTGRES_PORT, and Redis at REDIS_PORT. No homelab coupling:
# no external networks, no reverse-proxy labels.
#
# For the production deployment use docker-compose.prod.yml — the pinned
# file uploaded by CI (.github/workflows/deploy.yml) and installed by
# scripts/melora-deploy. That stack publishes NO host ports, uses the shared
# homelab Postgres (db_net), and is reached through the homelab caddy
# reverse proxy (proxy_net).
# =====================================================================
# Shared managed configuration.
# These values are interpolated from the root .env (and any matching
# environment variables) by `docker compose`, then injected into each
# service's container environment via the `environment` block.
# Referenced by services through the YAML anchor (&backend-env).
# =====================================================================
x-backend-env: &backend-env
  # App
  DEBUG: ${DEBUG:-false}
  JWT_SECRET_KEY: ${JWT_SECRET_KEY:-change-me-in-production-use-a-random-secret}
  ROOT_ADMIN_EMAIL: ${ROOT_ADMIN_EMAIL:-}
  FRONTEND_URL: ${FRONTEND_URL:-http://localhost:5173}
  BACKEND_CORS_ORIGINS: '${BACKEND_CORS_ORIGINS:-["*"]}'
  # Database (standalone Postgres, the `postgres` service in this file).
  # POSTGRES_HOST defaults to the compose service name `postgres`; the app
  # auto-runs `alembic upgrade head` on startup, so an empty DB self-migrates.
  POSTGRES_HOST: ${POSTGRES_HOST:-postgres}
  POSTGRES_PORT: 5432
  POSTGRES_USER: ${POSTGRES_USER:-melora}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-melora}
  POSTGRES_DB: ${POSTGRES_DB:-melora}
  DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-melora}:${POSTGRES_PASSWORD:-melora}@${POSTGRES_HOST:-postgres}:5432/${POSTGRES_DB:-melora}
  # Redis
  REDIS_URL: redis://redis:6379/0
  # Storage (mounted from the melora_data volume)
  DOWNLOADS_DIR: /app/data/downloads
  CACHE_DIR: /app/data/cache
  MEDIA_DIR: /app/data/media
  LOGS_DIR: /app/data/logs
  # Google OAuth (required for login)
  GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
  GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
  GOOGLE_REDIRECT_URI: ${GOOGLE_REDIRECT_URI:-http://localhost:8000/api/v1/auth/google/callback}

services:
  # PostgreSQL database (standalone, for local development)
  postgres:
    container_name: melora-postgres
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-melora}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-melora}
      POSTGRES_DB: ${POSTGRES_DB:-melora}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - melora_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: always

  # Redis for caching
  redis:
    container_name: melora-redis
    image: redis:7-alpine
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - melora_redis:/data
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    restart: always

  # Unified Fullstack Container (Frontend + Backend + Nginx)
  melora-fullstack:
    container_name: melora-fullstack
    image: ${REGISTRY_NAMESPACE:-melora-fullstack:latest}
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "${PORT:-80}:80"
    environment: *backend-env
    depends_on:
      redis:
        condition: service_started
      postgres:
        condition: service_healthy
    volumes:
      - melora_data:/app/data
    restart: always

networks:
  default:
    name: melora-music-stream_default

volumes:
  melora_data:
    driver: local
  melora_redis:
    driver: local
  melora_postgres:
    driver: local
