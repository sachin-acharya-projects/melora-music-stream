name: Backend quality checks

on:
  push:
    branches: [refactor]
  pull_request:
    branches: [refactor]

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    defaults:
      run:
        working-directory: backend
    env:
      DATABASE_URL: sqlite:///./melora-test.db
      REDIS_URL: redis://localhost:6379/0
      JWT_SECRET_KEY: ci-only-secret-not-for-production
      OIDC_SECRET_ENCRYPTION_KEY: ""
      DEBUG: "true"
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - name: Install backend and development dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Run focused Ruff correctness checks
        run: |
          ruff check --select E,F --ignore E501 \
            app/core/scopes.py \
            app/api/deps/auth.py \
            app/api/endpoints/developer.py \
            app/api/endpoints/oauth.py \
            app/api/endpoints/playlists.py \
            app/db/models/machine_client.py \
            app/db/models/oauth_application.py \
            app/db/models/oauth_tokens.py \
            app/db/models/personal_access_token.py \
            app/db/models/webhook.py \
            app/schemas/machine_clients.py \
            app/schemas/oauth.py \
            app/schemas/oauth_applications.py \
            app/schemas/personal_access_tokens.py \
            app/schemas/webhooks.py \
            app/services/authorization.py \
            app/services/machine_clients.py \
            app/services/oauth_applications.py \
            app/services/oauth_tokens.py \
            app/services/personal_access_tokens.py \
            app/services/webhooks.py \
            app/services/webhook_secrets.py \
            app/core/webhook_events.py \
            app/workers/webhook_worker.py \
            tests/api/test_developer_endpoints.py \
            tests/services/test_authorization.py \
            tests/services/test_machine_clients.py \
            tests/services/test_oauth_applications.py \
            tests/services/test_oauth_tokens.py \
            tests/services/test_personal_access_tokens.py \
            tests/services/test_webhooks.py
      - name: Run backend tests
        run: pytest -q

  migrations:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: melora
          POSTGRES_PASSWORD: melora-ci-password
          POSTGRES_DB: melora_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U melora -d melora_ci"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    defaults:
      run:
        working-directory: backend
    env:
      DATABASE_URL: postgresql+psycopg://melora:melora-ci-password@localhost:5432/melora_ci
      JWT_SECRET_KEY: ci-only-secret-not-for-production
      DEBUG: "true"
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Apply all Alembic migrations
        run: alembic upgrade head
