name: Deploy Melora

on:
  push:
    branches: [main]

jobs:
  deploy:
    name: Deploying to the Server
    runs-on: ubuntu-latest

    # Required for OIDC token exchange with GitHub
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Connect to Tailscale
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TS_CLIENT_ID }}
          audience: ${{ secrets.TS_AUDIENCE }}
          tags: tag:ci
          args: --ssh
          ping: ${{ secrets.SERVER_HOST }}

      - name: Deploy via Tailscale SSH
        run: |
          tailscale ssh "${{ secrets.SERVER_USERNAME }}@${{ secrets.SERVER_HOST }}" \
            "cd ${{ secrets.PROJECT_ROOT }} && bash deploy.sh"