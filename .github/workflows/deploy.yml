name: Deploy Melora

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy to the Server
    runs-on: ubuntu-latest

    # Required for OIDC token exchange with GitHub
    permissions:
      id-token: write
      contents: read

    env:
      # Private docker registry (registry:2) running in the homelab. It is
      # reached over the tailnet via caddy's reverse-proxy hostname (HTTPS),
      # so the push needs no insecure-registry configuration. REGISTRY_HOST,
      # REGISTRY_IMAGE and MELORA_DOMAIN are GitHub Secrets (set from
      # .env.production via scripts/set_secret.sh).
      REGISTRY_HOST: ${{ secrets.REGISTRY_HOST }}
      REGISTRY_IMAGE: ${{ secrets.REGISTRY_IMAGE || 'melora-fullstack:latest' }}
      MELORA_DOMAIN: ${{ secrets.MELORA_DOMAIN }}

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Connect to Tailscale
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TS_CLIENT_ID }}
          audience: ${{ secrets.TS_AUDIENCE }}
          tags: tag:ci
          ping: ${{ secrets.SERVER_HOST }}

      - name: Build and push image to the private registry
        run: |
          IMAGE="${REGISTRY_HOST}/${REGISTRY_IMAGE}"
          docker build -t "${IMAGE}" .
          docker push "${IMAGE}"

      # docker-compose.prod.yml is the only repo file the server needs at
      # runtime (nginx.conf, start.sh etc. are baked into the image at build
      # time). It is uploaded to a staging path the deploy account can write;
      # melora-deploy installs it into $PROJECT as root. The server has no
      # git checkout.
      # Piped over `tailscale ssh` because the runner's tailscale CLI has no
      # `scp` subcommand.
      - name: Upload docker-compose.prod.yml
        run: |
          cat docker-compose.prod.yml | tailscale ssh \
            "${{ secrets.SERVER_USERNAME }}@${{ secrets.SERVER_HOST }}" \
            "cat > /tmp/melora-docker-compose.prod.yml"

      - name: Deploy via Tailscale SSH
        run: |
          # Build the .env from GitHub Secrets and pipe it into the server's
          # sudo-protected deploy script (DEPLOY_SCRIPT_PATH). The script runs
          # as root, writes the .env (0600), pulls the image from the private
          # registry, starts the stack, health-checks, then removes the .env
          # again (pre/post-deploy cleanup). MELORA_DOMAIN feeds the caddy
          # reverse-proxy label in docker-compose.yml.
          {
            echo "PORT=${{ secrets.PORT || '8000' }}"
            echo "MELORA_PROJECT_DIR=${{ secrets.MELORA_PROJECT_DIR || '/opt/melora' }}"
            echo "DEBUG=${{ secrets.DEBUG || 'false' }}"
            echo "REGISTRY_NAMESPACE=${REGISTRY_HOST}/${REGISTRY_IMAGE}"
            echo "MELORA_DOMAIN=${MELORA_DOMAIN}"
            echo "REDIS_PORT=${{ secrets.REDIS_PORT || '6379' }}"
            echo "POSTGRES_USER=${{ secrets.POSTGRES_USER || 'melora' }}"
            echo "POSTGRES_PASSWORD=${{ secrets.POSTGRES_PASSWORD }}"
            echo "POSTGRES_DB=${{ secrets.POSTGRES_DB || 'melora' }}"
            echo "JWT_SECRET_KEY=${{ secrets.JWT_SECRET_KEY }}"
            echo "ROOT_ADMIN_EMAIL=${{ secrets.ROOT_ADMIN_EMAIL }}"
            echo "FRONTEND_URL=${{ secrets.FRONTEND_URL || 'http://localhost:8000' }}"
            echo 'BACKEND_CORS_ORIGINS=${{ secrets.BACKEND_CORS_ORIGINS || '["*"]' }}'
            echo "GOOGLE_CLIENT_ID=${{ secrets.GOOGLE_CLIENT_ID }}"
            echo "GOOGLE_CLIENT_SECRET=${{ secrets.GOOGLE_CLIENT_SECRET }}"
            echo "GOOGLE_REDIRECT_URI=${{ secrets.GOOGLE_REDIRECT_URI || 'http://localhost:8000/api/v1/auth/google/callback' }}"
          } | tailscale ssh "${{ secrets.SERVER_USERNAME }}@${{ secrets.SERVER_HOST }}" \
            "sudo -n \"${{ secrets.DEPLOY_SCRIPT_PATH }}\""
