name: Deploy Melora

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy to the Server
    runs-on: ubuntu-latest

    # Required for OIDC token exchange with GitHub
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Connect to Tailscale
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TS_CLIENT_ID }}
          audience: ${{ secrets.TS_AUDIENCE }}
          tags: tag:ci
          ping: ${{ secrets.SERVER_HOST }}

      - name: Test Tailscale SSH
        run: |
          echo "=== Tailscale status ==="
          tailscale status

          echo "=== Tailscale IP ==="
          tailscale ip

          echo "=== Tailscale ping ==="
          tailscale ping "${{ secrets.SERVER_HOST }}"

          echo "=== SSH ==="
          tailscale ssh \
            github-deploy@${{ secrets.SERVER_HOST }} \
            "id"

